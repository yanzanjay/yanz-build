name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Hancurkan Android Lama & Bikin Baru
        run: |
          mkdir -p bkp
          cp android/app/src/main/AndroidManifest.xml bkp/ 2>/dev/null || true
          mkdir -p bkp/kotlin
          cp -r android/app/src/main/kotlin/com/yanz/cheat bkp/kotlin/ 2>/dev/null || true
          mkdir -p bkp/xml
          cp android/app/src/main/res/xml/device_admin.xml bkp/xml/ 2>/dev/null || true
          
          rm -rf android
          flutter create --platforms=android --org com.yanz --project-name yanz_cheat .
          
          cp bkp/AndroidManifest.xml android/app/src/main/ 2>/dev/null || true
          mkdir -p android/app/src/main/kotlin/com/yanz/cheat
          cp bkp/kotlin/cheat/*.kt android/app/src/main/kotlin/com/yanz/cheat/ 2>/dev/null || true
          mkdir -p android/app/src/main/res/xml
          cp bkp/xml/device_admin.xml android/app/src/main/res/xml/ 2>/dev/null || true

          # TULIS ULANG BUILD.GRADLE DENGAN FIX KOTLIN & LISTENABLEFUTURE
          cat << 'EOF' > android/app/build.gradle
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found.")
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) { flutterVersionCode = '1' }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) { flutterVersionName = '1.0' }

          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

          // FIX DUPLICATE CLASS KOTLIN
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }

          android {
              namespace "com.yanz.cheat"
              compileSdkVersion 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = '17' }

              sourceSets { main.java.srcDirs += 'src/main/kotlin' }

              defaultConfig {
                  applicationId "com.yanz.cheat"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }

              buildTypes {
                  release { signingConfig signingConfigs.debug }
              }
          }

          flutter { source '../..' }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.camera:camera-core:1.3.4"
              implementation "androidx.camera:camera-camera2:1.3.4"
              implementation "androidx.camera:camera-lifecycle:1.3.4"
              // FIX LISTENABLEFUTURE ERROR
              implementation "androidx.concurrent:concurrent-futures:1.1.0" 
              implementation "com.google.guava:guava:31.1-android"
          }
          EOF

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Bikin File Resource yang Hilang
        run: |
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
          </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          mkdir -p android/app/src/main/res/mipmap-hdpi
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yanz-APK
          path: build/app/outputs/flutter-apk/app-release.apk
